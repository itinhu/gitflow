<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Git Flow - Testes</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="cadastro">
      <header class="cadastro__cabecalho">
        <p>Git Flow - Testes</p>
        <h1>Crie sua conta</h1>
        <p>Preencha os dados abaixo para realizar seu cadastro.</p>
      </header>

      <form id="formulario-cadastro" class="formulario">
        <div class="campo">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" autocomplete="name"
            placeholder="Digite seu nome completo" minlength="3" maxlength="100" required>
        </div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="email"
            placeholder="voce@exemplo.com" maxlength="254" required>
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" autocomplete="new-password"
            placeholder="Crie uma senha" minlength="8" aria-describedby="ajuda-senha" required>
          <small id="ajuda-senha">Use pelo menos 8 caracteres.</small>
        </div>

        <div class="campo">
          <label for="confirmacao-senha">Confirme sua senha</label>
          <input type="password" id="confirmacao-senha" name="confirmacaoSenha"
            autocomplete="new-password" placeholder="Digite sua senha novamente"
            minlength="8" required>
        </div>

        <button type="submit">Cadastrar</button>
        <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
      </form>
    </main>
  </body>
</html>
